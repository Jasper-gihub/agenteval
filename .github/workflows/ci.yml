name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile
        run: python -m compileall -q src examples tests

      - name: Unit tests
        run: PYTHONPATH=src python -m pytest tests -q

  gate:
    # 这个 job 是仓库的主张本身：评测要能当门禁用。
    # 用假 agent 跑端到端（不调用任何模型、不花钱），然后真的过一次回归门禁。
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: End-to-end run (fake agents, no API calls)
        run: |
          PYTHONPATH=src python examples/pipeline.py \
            --dataset examples/tiny_tasks.yaml \
            --out-dir /tmp/records

      - name: Regression gate
        run: |
          PYTHONPATH=src python -m agenteval gate \
            --baseline /tmp/records/v1.jsonl \
            --candidate /tmp/records/v2.jsonl \
            --require-significance

      - name: Report preview
        run: |
          PYTHONPATH=src python -m agenteval report \
            --records /tmp/records/v2.jsonl \
            --baseline /tmp/records/v1.jsonl \
            --label v2 --baseline-label v1 \
            --out /tmp/records/report.md
          head -n 30 /tmp/records/report.md
